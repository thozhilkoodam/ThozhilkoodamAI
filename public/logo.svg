<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="36" fill="url(#bg-grad)"/>
  <g transform="translate(100,100)">
    <!-- Briefcase body -->
    <rect x="-40" y="-18" width="80" height="55" rx="6" fill="none" stroke="white" stroke-width="4.5"/>
    <!-- Briefcase handle -->
    <path d="M-22,-18 L-22,-30 A22,22 0 0,1 22,-30 L22,-18" fill="none" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Briefcase line -->
    <line x1="-40" y1="5" x2="40" y2="5" stroke="white" stroke-width="3" opacity="0.5"/>
    <!-- T and K letters -->
    <text x="-8" y="22" font-family="Arial,sans-serif" font-weight="bold" font-size="16" fill="white">TK</text>
  </g>
</svg>
